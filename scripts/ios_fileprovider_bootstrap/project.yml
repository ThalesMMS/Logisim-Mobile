name: LogisimFileProviderBootstrap
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTED_PLATFORMS: iphonesimulator
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
targets:
  FileProviderBootstrapTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - FileProviderBootstrapTests.swift
      - FixtureArtifactAdmission.swift
      - path: ProvenanceSignedFixture.json
        buildPhase: resources
      - path: ProvenanceArtifactReview.json
        buildPhase: resources
    info:
      path: TestInfo.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: thalesmms.logisim.validation.fileproviderbootstrap
        TEST_TARGET_NAME: ""
        GENERATE_INFOPLIST_FILE: NO
schemes:
  FixtureBootstrap:
    build:
      targets:
        FileProviderBootstrapTests: all
    test:
      targets:
        - FileProviderBootstrapTests
      gatherCoverageData: false
