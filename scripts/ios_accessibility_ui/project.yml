name: LogisimAccessibilityHarness
options:
  bundleIdPrefix: thalesmms.logisim.validation
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  AccessibilityUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - AccessibilityUITests.swift
      - NativeUIHarness.swift
      - path: Catalog.json
        buildPhase: resources
    info:
      path: TestInfo.plist
      properties:
        TargetAppBundleIdentifier: $(LOGISIM_TEST_BUNDLE_ID)
        ComponentSearch: $(LOGISIM_COMPONENT_SEARCH)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: thalesmms.logisim.validation.accessibility
        TEST_TARGET_NAME: ""
        GENERATE_INFOPLIST_FILE: NO
schemes:
  AccessibilityHarness:
    build:
      targets:
        AccessibilityUITests: all
    test:
      targets:
        - AccessibilityUITests
      gatherCoverageData: false
