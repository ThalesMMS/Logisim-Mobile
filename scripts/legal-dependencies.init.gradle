import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.maven.MavenModule
import org.gradle.maven.MavenPomArtifact

allprojects { target ->
    if (target.path == ':composeApp') {
        tasks.register('exportLegalRuntimeDependencies') {
            doLast {
                def configurationNames = ['androidRuntimeClasspath', 'iosArm64CompileKlibraries', 'iosSimulatorArm64CompileKlibraries']
                def components = [:]
                configurationNames.each { name ->
                    def configuration = target.configurations.getByName(name)
                    configuration.incoming.resolutionResult.allComponents.each { component ->
                        if (component.id instanceof ModuleComponentIdentifier) {
                            def id = component.id
                            def key = "${id.group}:${id.module}:${id.version}"
                            if (!components.containsKey(key)) {
                                components[key] = [id: id, group: id.group, name: id.module, version: id.version, configurations: []]
                            }
                            components[key].configurations.add(name)
                        }
                    }
                }
                def pomResults = target.dependencies.createArtifactResolutionQuery()
                    .forComponents(components.values().collect { it.id })
                    .withArtifacts(MavenModule, MavenPomArtifact)
                    .execute()
                def poms = [:]
                pomResults.resolvedComponents.each { component ->
                    component.getArtifacts(MavenPomArtifact).each { artifact ->
                        if (artifact.hasProperty('file')) poms[component.id.toString()] = artifact.file.absolutePath
                    }
                }
                def rows = components.collect { key, value ->
                    [coordinate: key, group: value.group, name: value.name, version: value.version,
                     configurations: value.configurations.unique().sort(), pom: poms[value.id.toString()]]
                }.sort { it.coordinate }
                def output = target.rootProject.file(target.findProperty('legalOutput') ?: 'build/legal/runtime-dependencies.json')
                output.parentFile.mkdirs()
                output.text = JsonOutput.prettyPrint(JsonOutput.toJson([schemaVersion: 1, dependencies: rows])) + '\n'
                println("Wrote ${rows.size()} runtime dependency records to ${output}")
            }
        }
    }
}
