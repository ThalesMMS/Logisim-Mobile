name: LogisimHdlHarness
options:
  bundleIdPrefix: thalesmms.logisim.validation
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  HdlEndToEndTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - NativeUIHarness.swift
      - NativeTextReplacement.swift
      - HdlEndToEndTests.swift
      - path: Catalog.json
        buildPhase: resources
      - path: Run.json
        buildPhase: resources
    info:
      path: TestInfo.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: thalesmms.logisim.validation.hdl
        TEST_TARGET_NAME: ""
        GENERATE_INFOPLIST_FILE: NO
schemes:
  HdlHarness:
    build:
      targets:
        HdlEndToEndTests: all
    test:
      targets:
        - HdlEndToEndTests
      gatherCoverageData: false
