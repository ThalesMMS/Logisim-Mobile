name: LogisimProviderAuthenticationHarness
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTED_PLATFORMS: iphonesimulator
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
targets:
  ProviderAuthenticationEndToEndTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - NativeUIHarness.swift
      - NativeFilesDestinationNavigator.swift
      - ProviderAuthenticationEndToEndTests.swift
      - ProviderAuthenticationOracle.swift
      - ProviderFixtureController.swift
      - ProviderFilesNavigator.swift
      - path: Catalog.json
        buildPhase: resources
      - path: Run.json
        buildPhase: resources
      - path: ProvenanceMainArtifact.json
        buildPhase: resources
      - path: ProvenanceSignedFixture.json
        buildPhase: resources
      - path: ProvenanceArtifactReview.json
        buildPhase: resources
    info:
      path: TestInfo.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: thalesmms.logisim.validation.providerauth
        TEST_TARGET_NAME: ""
        GENERATE_INFOPLIST_FILE: NO
schemes:
  ProviderAuthenticationHarness:
    build:
      targets:
        ProviderAuthenticationEndToEndTests: all
    test:
      targets:
        - ProviderAuthenticationEndToEndTests
      gatherCoverageData: false
