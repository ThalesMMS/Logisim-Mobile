name: LogisimEditorHarness
options:
  bundleIdPrefix: thalesmms.logisim.validation
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  ClipboardReceiver:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ClipboardReceiver
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: thalesmms.logisim.validation.clipboardreceiver
        PRODUCT_NAME: ClipboardReceiver
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SUPPORTED_PLATFORMS: iphonesimulator
        SDKROOT: iphonesimulator
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ClipboardReceiver/Info.plist
  EditorEndToEndTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - NativeUIHarness.swift
      - NativeTextReplacement.swift
      - DocumentWindowRules.swift
      - DocumentWindowScope.swift
      - ClipboardReceiverUI.swift
      - EditorEndToEndTests.swift
      - FilesEndToEndTests.swift
      - ObservedProjectXML.swift
      - IoEndToEndTests.swift
      - InspectorEndToEndTests.swift
      - NativeFilesDestinationNavigator.swift
      - DestinationExportEndToEndTests.swift
      - VisualExportEndToEndTests.swift
      - XmlDialogEndToEndTests.swift
      - PortableProjectEndToEndTests.swift
      - PortableWorkspaceEvidence.swift
      - ExternalProviderEndToEndTests.swift
      - NativeFilesPeerNavigator.swift
      - path: Catalog.json
        buildPhase: resources
      - path: Run.json
        buildPhase: resources
      - path: editor-actions-v1.json
        buildPhase: resources
      - path: io-actions-v1.json
        buildPhase: resources
    info:
      path: TestInfo.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: thalesmms.logisim.validation.editor
        TEST_TARGET_NAME: ""
        GENERATE_INFOPLIST_FILE: NO
schemes:
  ClipboardReceiver:
    build:
      targets:
        ClipboardReceiver: all
  EditorHarness:
    build:
      targets:
        ClipboardReceiver: all
        EditorEndToEndTests: all
    test:
      targets:
        - EditorEndToEndTests
      gatherCoverageData: false
