name: LogisimRevocationFixture
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
targets:
  RevocationFixture:
    type: application
    platform: iOS
    sources:
      - ControlApp
      - Shared
    dependencies:
      - target: RevocationProvider
        embed: true
      - sdk: FileProvider.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: thalesmms.logisim.validation.revocationfixture
        INFOPLIST_FILE: Config/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/App.entitlements
  RevocationProvider:
    type: app-extension
    platform: iOS
    sources:
      - Provider
      - Shared
    dependencies:
      - sdk: FileProvider.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: thalesmms.logisim.validation.revocationfixture.provider
        INFOPLIST_FILE: Config/Provider-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Provider.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
schemes:
  RevocationFixture:
    build:
      targets:
        RevocationFixture: all
