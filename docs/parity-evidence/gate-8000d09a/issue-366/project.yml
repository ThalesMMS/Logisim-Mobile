name: Probe366
options:
  bundleIdPrefix: thalesmms.logisim.validation
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Probe366Tests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Probe366Tests.swift
    info:
      path: TestInfo.plist
      properties:
        TargetAppBundleIdentifier: thalesmms.logisim.mobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: thalesmms.logisim.validation.probe366
        TEST_TARGET_NAME: ""
schemes:
  Probe366:
    build:
      targets:
        Probe366Tests: all
    test:
      targets:
        - Probe366Tests
      gatherCoverageData: false
